name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run build

      # Live demo (spec 2.9): the app's own frontend from its latest release, built under /demo/.
      - name: Find the latest app release
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo DiskSieve/disksieve --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: DiskSieve/disksieve
          ref: ${{ steps.app.outputs.tag }}
          path: .demo-app
          persist-credentials: false

      - name: Build the demo
        run: node scripts/demo.mjs .demo-app

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Ships dist/.well-known/ (the ARD manifest for AI agents): dot folders are left out by default.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
