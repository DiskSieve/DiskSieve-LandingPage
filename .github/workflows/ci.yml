name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

      # Live demo (spec 2.9): the app's own frontend from its latest release, built under /demo/.
      - name: Find the latest app release
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo DiskSieve/disksieve --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: DiskSieve/disksieve
          ref: ${{ steps.app.outputs.tag }}
          path: .demo-app
          persist-credentials: false

      - name: Build the demo
        run: node scripts/demo.mjs .demo-app
